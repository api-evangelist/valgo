openapi: 3.1.0
info:
  title: Human Crash Baselines Compute Compute Depot Route API
  description: Compute human crash-rate baselines over filterable crash and exposure data. The versioned, API-key-authenticated public surface lives under `/v1`; call `GET /v1/filters` to discover every filter and valid value. Send your key via the `X-API-Key` header.
  version: 0.1.3
tags:
- name: Compute Depot Route
paths:
  /compute-depot-route:
    post:
      summary: Post Compute Depot Route
      operationId: post_compute_depot_route_compute_depot_route_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeDepotRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Compute Depot Route Compute Depot Route Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Compute Depot Route
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DepotPin:
      properties:
        lat:
          type: number
          title: Lat
        lon:
          type: number
          title: Lon
      type: object
      required:
      - lat
      - lon
      title: DepotPin
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ComputeDepotRouteRequest:
      properties:
        county:
          type: string
          title: County
          default: travis
        depot_a:
          $ref: '#/components/schemas/DepotPin'
        depot_b:
          $ref: '#/components/schemas/DepotPin'
        selections:
          additionalProperties: true
          type: object
          title: Selections
      type: object
      required:
      - depot_a
      - depot_b
      title: ComputeDepotRouteRequest
