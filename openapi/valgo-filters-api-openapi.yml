openapi: 3.2.0
info:
  title: Human Crash Baselines Filters API
  description: Compute human crash-rate baselines over filterable crash and exposure data. The versioned, API-key-authenticated public surface lives under `/v1`; call `GET /v1/filters` to discover every filter and valid value. Send your key via the `X-API-Key` header.
  version: 0.1.3
tags:
- name: Filters
paths:
  /v1/filters:
    get:
      tags:
      - Filters
      summary: V1 Filters
      description: 'Discover every filter dimension, its valid options, and the default for

        each compute mode (geofence / route / depot).'
      operationId: v1_filters_v1_filters_get
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiltersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FilterDef:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        affects:
          type: string
          title: Affects
        multiselect:
          type: boolean
          title: Multiselect
        description:
          type: string
          title: Description
        options:
          items:
            $ref: '#/components/schemas/FilterOption'
          type: array
          title: Options
        default:
          title: Default
      additionalProperties: true
      type: object
      required:
      - id
      - label
      - affects
      - multiselect
      - description
      - options
      title: FilterDef
    FilterOption:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
      type: object
      required:
      - id
      - label
      title: FilterOption
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    FiltersResponse:
      properties:
        modes:
          additionalProperties:
            items:
              $ref: '#/components/schemas/FilterDef'
            type: array
          type: object
          title: Modes
      type: object
      required:
      - modes
      title: FiltersResponse
