openapi: 3.1.0
info:
  title: Human Crash Baselines Compute Compute Route API
  description: Compute human crash-rate baselines over filterable crash and exposure data. The versioned, API-key-authenticated public surface lives under `/v1`; call `GET /v1/filters` to discover every filter and valid value. Send your key via the `X-API-Key` header.
  version: 0.1.3
tags:
- name: Compute Route
paths:
  /compute-route:
    post:
      summary: Post Compute Route
      operationId: post_compute_route_compute_route_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Compute Route Compute Route Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Compute Route
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ComputeRouteRequest:
      properties:
        county:
          type: string
          title: County
          default: travis
        segment_ids:
          items:
            prefixItems:
            - type: string
            - type: integer
            type: array
            maxItems: 2
            minItems: 2
          type: array
          title: Segment Ids
        selections:
          additionalProperties: true
          type: object
          title: Selections
      type: object
      required:
      - segment_ids
      title: ComputeRouteRequest
