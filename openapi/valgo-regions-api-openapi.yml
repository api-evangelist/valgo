openapi: 3.2.0
info:
  title: Human Crash Baselines Regions API
  description: Compute human crash-rate baselines over filterable crash and exposure data. The versioned, API-key-authenticated public surface lives under `/v1`; call `GET /v1/filters` to discover every filter and valid value. Send your key via the `X-API-Key` header.
  version: 0.1.3
tags:
- name: Regions
paths:
  /v1/regions:
    get:
      tags:
      - Regions
      summary: V1 Regions
      description: Counties available on this server and which compute modes each supports.
      operationId: v1_regions_v1_regions_get
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RegionsResponse:
      properties:
        regions:
          items:
            $ref: '#/components/schemas/RegionInfo'
          type: array
          title: Regions
        default_county:
          type: string
          title: Default County
          default: travis
      type: object
      required:
      - regions
      title: RegionsResponse
    RegionInfo:
      properties:
        county:
          type: string
          title: County
        modes:
          items:
            type: string
          type: array
          title: Modes
      type: object
      required:
      - county
      - modes
      title: RegionInfo
