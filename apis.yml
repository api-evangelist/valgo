aid: valgo
name: Valgo
description: >-
  Valgo is a public benefit corporation building the risk quantification layer
  for physical AI - the insurance risk layer autonomous systems need. Insurers
  struggle to price autonomous trucks, robotaxis, and robots because the
  historical claims data does not exist, so Valgo builds probabilistic models
  of routes, tasks, and environments from the bottom up and outputs the
  simulated loss estimates insurers need to price coverage across validation,
  deployment, and insurance. Founded by Stanford safety-validation researchers
  and an actuary with over a decade of insurance leadership, Valgo is a Y
  Combinator W26 company backed by Floodgate and Menlo Ventures, and publishes
  research including human crash baselines for robotaxis and robotrucks.
